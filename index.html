    <button id="installBtn" style="display: none;" >Install App</button>

<script>
    // 1. Register the Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Registered"))
            .catch(err => console.log("Service Worker Failed", err));
    }

    // 2. Global state for the installation prompt
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    // 3. Listen for the browser's install offer
    window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome from showing its default banner automatically
        e.preventDefault();
        // Save the event so we can trigger it when the user clicks our button
        deferredPrompt = e;
        // Show our custom install button
        //installBtn.style.display = 'inline-block';
        console.log("'beforeinstallprompt' event fired and stashed.");
    });

    // 4. Handle the button click completely independently
    installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) {
            console.log("Installation prompt is not available yet.");
            return;
        }
        
        // Hide our button so the user doesn't double-click
        installBtn.style.display = 'none';
        
        // Show the browser's native install dialog
        deferredPrompt.prompt();
        
        // Wait for the user to make a choice
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to the install prompt: ${outcome}`);
        
        // Clear the stashed prompt; it can only be used once
        deferredPrompt = null;
    });

    // 5. Hide button if the app is already successfully installed
    window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
        deferredPrompt = null;
        console.log('PWA was installed successfully!');
    });
</script>

<script>
function clean(text) {
    if (!text) return "";
    return text.replace(/"/g, "").trim();
}

function parseJavaDate(dateStr) {
    const parts = dateStr.split('/');
    if (parts.length !== 3) return null;
    const day = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1; 
    const year = parseInt(parts[2], 10);
    return new Date(year, month, day);
}

function processAndDisplay() {
    const fileInput = document.getElementById('csvFile');
    const startDateInput = document.getElementById('startDate').value;
    const endDateInput = document.getElementById('endDate').value;

    if (!fileInput.files || !fileInput.files.length || !startDateInput || !endDateInput) {
        alert('الرجاء اختيار ملف الـ CSV وتحديد تواريخ البدء والنهاية أولاً يا حمودة!');
        return;
    }

    const file = fileInput.files[0];
    const startDate = new Date(startDateInput);
    const endDate = new Date(endDateInput);
    endDate.setHours(23, 59, 59, 999); 

    const reader = new FileReader();

    reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split(/\r?\n/);
        if (lines.length < 2) {
            alert('الملف فارغ أو غير صالح!');
            return;
        }

        const headerLine = lines[0];
        const separator = headerLine.includes('\t') ? '\t' : ',';
        
        let monthlyAnalysis = {};
        let globalCategorySums = {}; 

        for (let i = 1; i < lines.length; i++) {
            let line = lines[i];
            if (!line.trim()) continue;

            let columns = [];
            if (separator === ',') {
                columns = line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/);
            } else {
                columns = line.split('\t');
            }

            if (columns.length < 7) continue;

            try {
                let dateStr = clean(columns.at(0));       
                let category = clean(columns.at(2));      
                let amountStr = clean(columns.at(5));     
                
                let description = "بدون وصف";
                if (columns.length >= 8 && clean(columns.at(7)).length > 0) {
                    description = clean(columns.at(7));   
                }

                let rowDate = parseJavaDate(dateStr);
                if (!rowDate || isNaN(rowDate.getTime())) continue;

                if (rowDate >= startDate && rowDate <= endDate) {
                    if (category.startsWith("To '") || category.startsWith("From '") || 
                        category.toLowerCase().includes("to '") || category.toLowerCase().includes("from '")) {
                        continue;
                    }

                    let convertedAmount = parseFloat(amountStr);
                    if (convertedAmount >= 0) continue;
                    let actualExpense = Math.abs(convertedAmount);
                    let monthKey = rowDate.getFullYear() + "-" + String(rowDate.getMonth() + 1).padStart(2, '0');

                    if (!monthlyAnalysis[monthKey]) monthlyAnalysis[monthKey] = {};
                    if (!monthlyAnalysis[monthKey][category]) monthlyAnalysis[monthKey][category] = {};
                    monthlyAnalysis[monthKey][category][description] = (monthlyAnalysis[monthKey][category][description] || 0) + actualExpense;

                    globalCategorySums[category] = (globalCategorySums[category] || 0) + actualExpense;
                }
            } catch (err) {}
        }
        const resultsContainer = document.getElementById('resultsContainer');
        resultsContainer.innerHTML = ""; 
        resultsContainer.style.display = "block";

        let sortedMonths = Object.keys(monthlyAnalysis).sort();

        if (sortedMonths.length === 0) {
            resultsContainer.innerHTML = "<div class='container' style='text-align:center; font-weight:bold; color:red;'>لم يتم العثور على أي مصاريف مطابقة للتواريخ يا حمودة! تأكد من الفترات الزمنية والملف المختار.</div>";
            return;
        }

        let previousMonthTotal = 0;

        sortedMonths.forEach((monthName, mIdx) => {
            let monthTotal = 0;
            let categoriesMap = monthlyAnalysis[monthName];
            let categorySums = {};

            Object.keys(categoriesMap).forEach(cat => {
                let sum = Object.values(categoriesMap[cat]).reduce((a, b) => a + b, 0);
                categorySums[cat] = sum;
                monthTotal += sum;
            });

            let monthBlock = document.createElement('div');
            monthBlock.className = 'month-block-wrapper';
            let monthBodyId = `month_body_${mIdx}`;

            let htmlTable = `<table>
            <tr class='month-header-row'>
                <td colspan='4' onclick="toggleMonthSection('${monthBodyId}', this)">
                    <button class='toggle-all-btn' onclick="toggleAllCategoriesInMonth('${monthBodyId}', event)">📁 طي/توسيع الكل</button>
                    <span class='collapse-icon'>▲</span> 📅 فترة شهر: ${monthName}
                </td>
            </tr>
            <tbody id='${monthBodyId}'>`;

            let sortedCats = Object.keys(categorySums).sort((a, b) => categorySums[b] - categorySums[a]);
            let chartHtml = `<div class='native-chart-wrapper' id='chart_wrapper_${monthBodyId}'><h3 style='color:#1A365D; text-align:center; margin-bottom:15px;'>📊 التوزيع المرئي لنفقات شهر ${monthName}</h3>`;

            sortedCats.forEach((categoryName, cIdx) => {
                let categoryTotal = categorySums[categoryName];
                let categoryPercentage = monthTotal > 0 ? (categoryTotal / monthTotal) * 100 : 0;

                chartHtml += `
                    <div class='chart-bar-row'>
                        <div class='chart-label'>📁 ${categoryName}</div>
                        <div class='chart-bar-container'>
                            <div class='chart-bar-fill' style='width: ${categoryPercentage.toFixed(1)}%;'></div>
                        </div>
                        <div class='chart-value'>$${categoryTotal.toFixed(2)} (${categoryPercentage.toFixed(1)}%)</div>
                    </div>
                `;

                let catRowsClass = `cat_rows_${mIdx}_${cIdx}`;

                htmlTable += `
                <tr class='category-header-row' onclick="toggleCategorySection('${catRowsClass}', this)" data-target-class='${catRowsClass}'>
                    <td colspan='4'>
                        <div class='cat-header-flex'>
                            <span><span class='collapse-icon'>▲</span> 📁 [${categoryName}]</span>
                            <span style='color: #2B6CB0; font-size: 13pt;'>إجمالي القسم: $${categoryTotal.toFixed(2)} (${categoryPercentage.toFixed(1)}%)</span>
                        </div>
                    </td>
                </tr>`;

                let descMap = categoriesMap[categoryName];
                let sortedDescs = Object.keys(descMap).sort((a, b) => descMap[b] - descMap[a]);

                sortedDescs.forEach(descriptionName => {
                    let amount = descMap[descriptionName];
                    let rowClass = amount >= 50.0 ? " class='alert-row'" : "";
                    let alertTag = amount >= 50.0 ? " ⚠️ [مصروف مرتفع طارئ]" : "";

                    htmlTable += `<tr${rowClass} name='${catRowsClass}'>
                        <td style='text-align:center;'>${monthName}</td>
                        <td>${categoryName}</td>
                        <td>${descriptionName}${alertTag}</td>
                        <td style='font-weight: bold;'>$${amount.toFixed(2)}</td>
                    </tr>`;
                });

                htmlTable += `<tr class='category-total-row' name='${catRowsClass}'>
                    <td colspan='3' style='text-align:right; padding-right:30px;'> ── مجموع نفقات تصنيف [${categoryName}]</td>
                    <td style='font-weight: bold;'>$${categoryTotal.toFixed(2)}</td>
                </tr>`;
            });

            chartHtml += `</div>`;

            let momTrendText = "";
            if (previousMonthTotal > 0) {
                let difference = monthTotal - previousMonthTotal;
                let percentChange = (difference / previousMonthTotal) * 100;
                if (difference > 0) {
                    momTrendText = ` 📈 (زيادة بمقدار ${percentChange.toFixed(1)}% عن الشهر السابق)`;
                } else if (difference < 0) {
                    momTrendText = ` 📉 (وفر وانخفاض بمقدار ${Math.abs(percentChange).toFixed(1)}% عن الشهر السابق)`;
                } else {
                    momTrendText = " ⚖️ (مساوي تماماً للمصروف السابق)";
                }
            } else {
                momTrendText = " 🏁 [شهر الأساس الأول]";
            }

            htmlTable += `</tbody></table>`;

            let totalTableHtml = `
            <table class='month-total-table'>
                <tr class='month-total-row'>
                    <td style='padding-right:20px;'>💰 إجمالي حجم الصرف الكلي لشهر (${monthName})${momTrendText}</td>
                    <td style='font-weight: bold; width: 150px; text-align: left;'>$${monthTotal.toFixed(2)}</td>
                </tr>
            </table>`;

            let monthDataDiv = document.createElement('div');
            monthDataDiv.innerHTML = htmlTable + totalTableHtml + chartHtml;
            
            monthBlock.appendChild(monthDataDiv);
            resultsContainer.appendChild(monthBlock);
            previousMonthTotal = monthTotal;
        });
        let globalBlock = document.createElement('div');
        globalBlock.className = 'global-block-wrapper';
        
		        // 📦 كود مستقل تماماً: كاشف الاشتراكات والمصاريف المتكررة
        let descriptionMonths = {}; 
        let descriptionAmounts = {}; 

        // المرور على شجرة البيانات المخزنة مسبقاً دون تعديلها
        Object.keys(monthlyAnalysis).forEach(month => {
            Object.keys(monthlyAnalysis[month]).forEach(cat => {
                Object.keys(monthlyAnalysis[month][cat]).forEach(desc => {
                    if (desc === "بدون وصف") return; 
                    
                    if (!descriptionMonths[desc]) descriptionMonths[desc] = new Set();
                    descriptionMonths[desc].add(month);
                    
                    if (!descriptionAmounts[desc]) descriptionAmounts[desc] = [];
                    descriptionAmounts[desc].push(monthlyAnalysis[month][cat][desc]);
                });
            });
        });

        let subscriptionHtml = `<div class='global-block-wrapper' style='border: 2px solid #319795; background-color: #F0FDF4; margin-top: 35px;'>
            <h2 style='color:#234E52; text-align:center; margin-top:10px;'>📦 قائمة الاشتراكات الثابتة والمصاريف الدورية المتكررة</h2>
            <p style='text-align:center; color:#4A5568; font-size:14px; margin-bottom:20px;'>الأوصاف التي تكررت بنفس الاسم على مدار أشهر مختلفة</p>
            <table>
                <tr><th>الوصف (Subscription)</th><th>عدد أشهر التكرار</th><th>متوسط الصرف الشهري</th></tr>`;

        let hasSubscriptions = false;
        Object.keys(descriptionMonths).forEach(desc => {
            // إذا تكرر الوصف في شهرين أو أكثر، يعتبر اشتراكاً دورياً
            if (descriptionMonths[desc].size >= 2) {
                hasSubscriptions = true;
                let sum = descriptionAmounts[desc].reduce((a, b) => a + b, 0);
                let avg = sum / descriptionMonths[desc].size;
                
                subscriptionHtml += `<tr>
                    <td style='color:#234E52;'>🔄 ${desc}</td>
                    <td style='text-align:center;'>${descriptionMonths[desc].size} أشهر</td>
                    <td style='font-weight: bold; color:#2F855A;'>$${avg.toFixed(2)} / شهر</td>
                </tr>`;
            }
        });

        if (!hasSubscriptions) {
            subscriptionHtml += `<tr><td colspan='3' style='text-align:center; color:#718096;'>لم يتم اكتشاف أي نفقات أو اشتراكات متكررة في هذه الفترة يا حمودة.</td></tr>`;
        }
        subscriptionHtml += `</table></div>`;

        let globalChartHtml = `<h2 style='color:#2B6CB0; text-align:center; margin-top:10px;'>👑 المخطط التحليلي الشامل والنهائي لكافة الأشهر المحددة معاً</h2>
                               <p style='text-align:center; color:#718096; font-size:14px; margin-bottom:20px;'>يوضح الحجم الإجمالي التراكمي الاستهلاكي لكل تصنيف على مدار كامل فترة الفلترة المشمولة</p>`;

        let globalTotalAmount = Object.values(globalCategorySums).reduce((a, b) => a + b, 0);
        Object.keys(globalCategorySums).sort((a,b) => globalCategorySums[b] - globalCategorySums[a]).forEach(cat => {
            let amount = globalCategorySums[cat];
            let percentage = globalTotalAmount > 0 ? (amount / globalTotalAmount) * 100 : 0;
            
            globalChartHtml += `
                <div class='chart-bar-row'>
                    <div class='chart-label' style='color:#2B6CB0;'>👑 ${cat}</div>
                    <div class='chart-bar-container'>
                        <div class='chart-bar-fill' style='width: ${percentage.toFixed(1)}%; background: linear-gradient(90deg, #2B6CB0, #3182CE);'></div>
                    </div>
                    <div class='chart-value' style='font-weight:bold;'>$${amount.toFixed(2)} (${percentage.toFixed(1)}%)</div>
                </div>
            `;
        });
        
        globalBlock.innerHTML = globalChartHtml;
        resultsContainer.appendChild(globalBlock);
		        // حقن جدول كاشف الاشتراكات المطور في نهاية لوحة العرض
        let subBlock = document.createElement('div');
        subBlock.innerHTML = subscriptionHtml;
        resultsContainer.appendChild(subBlock);

    };

    reader.readAsText(file, 'UTF-8');
}

function toggleMonthSection(monthBodyId, headerElement) {
    const element = document.getElementById(monthBodyId);
    const iconElement = headerElement.querySelector('.collapse-icon');
    if (element) {
        if (element.style.display === "none") {
            element.style.display = "";
            if (iconElement) iconElement.innerHTML = "▲";
        } else {
            element.style.display = "none";
            if (iconElement) iconElement.innerHTML = "▼";
        }
    }
}

function toggleCategorySection(targetClass, headerElement) {
    const rows = document.getElementsByName(targetClass);
    const iconElement = headerElement.querySelector('.collapse-icon');
    if (rows.length > 0) {
        const isHidden = rows[0].style.display === "none";
        for (let i = 0; i < rows.length; i++) {
            rows[i].style.display = isHidden ? "" : "none";
        }
        if (iconElement) iconElement.innerHTML = isHidden ? "▲" : "▼";
    }
}

function toggleAllCategoriesInMonth(monthBodyId, event) {
    event.stopPropagation(); 
    const tbody = document.getElementById(monthBodyId);
    if (!tbody) return;
    
    const catHeaders = tbody.querySelectorAll('.category-header-row');
    if (catHeaders.length === 0) return;
    
    const firstTargetClass = catHeaders[0].getAttribute('data-target-class');
    const firstRows = document.getElementsByName(firstTargetClass);
    const shouldHide = firstRows.length > 0 && firstRows[0].style.display !== "none";
    
    catHeaders.forEach(header => {
        const targetClass = header.getAttribute('data-target-class');
        const rows = document.getElementsByName(targetClass);
        const iconElement = header.querySelector('.collapse-icon');
        
        for (let i = 0; i < rows.length; i++) {
            rows[i].style.display = shouldHide ? "none" : "";
        }
        if (iconElement) iconElement.innerHTML = shouldHide ? "▼" : "▲";
    });
}

// القسم 2: معالجة البيانات الفورية وربط الفهارس بخريطة الخطة الخماسية
function processFinancialCSV(rawLines) {
    globalParsedData = []; // إعادة تعيين البيانات
    
    // مصفوفة تجميع الأظرف الخمسة
    const jarsTotals = { fixed: 0, guiltFree: 0, debt: 0, savings: 0, investing: 0 };

    rawLines.forEach((line) => {
        if (!line || line.trim() === "") return;
        const columns = line.split(','); // تقسيم السطر بناءً على فاصلة الـ CSV
        
        // استخراج البيانات بالاعتماد الصارم على النواة المقدسة والمستقرة
        const rawCategory = columns[CSV_INDICES.CATEGORY] ? columns[CSV_INDICES.CATEGORY].trim() : "";
        const rawAmount = columns[CSV_INDICES.AMOUNT] ? parseFloat(columns[CSV_INDICES.AMOUNT].trim()) : 0;
        const rawDate = columns[CSV_INDICES.DATE] ? columns[CSV_INDICES.DATE].trim() : "";
        const rawDesc = columns[CSV_INDICES.DESC] ? columns[CSV_INDICES.DESC].trim() : "";

        if (isNaN(rawAmount) || rawAmount <= 0) return;

        // تخزين البيانات للواجهة التفصيلية المقاومة للتخريب
        globalParsedData.push({ date: rawDate, category: rawCategory, amount: rawAmount, desc: rawDesc });

        // مطابقة التصنيف الفعلي مع الوعاء المالي المناسب في الخطة الخماسية
        let matched = false;
        for (const jarKey in JARS_MAPPING) {
            if (JARS_MAPPING[jarKey].categories.map(c => c.toLowerCase()).includes(rawCategory.toLowerCase())) {
                jarsTotals[jarKey] += rawAmount;
                matched = true;
                break;
            }
        }
    });

    // تحديث الواجهة التفاعلية للأظرف بناءً على الحسبة الجديدة
    renderFiveJarsBars(jarsTotals);
    // استدعاء واجهة الشهور والتصنيفات الأصلية (القسم 4)
    renderMonthlyCollapseInterface();
}

// القسم 3: بناء وتحديث الـ Native CSS Bars التفاعلية للخطة الخماسية
function updateFiveJarsPlan() {
    // إعادة الحساب الفوري للأظرف عند تغيير حقل الدخل يدوياً
    const jarsTotals = { fixed: 0, guiltFree: 0, debt: 0, savings: 0, investing: 0 };
    
    globalParsedData.forEach(item => {
        for (const jarKey in JARS_MAPPING) {
            if (JARS_MAPPING[jarKey].categories.map(c => c.toLowerCase()).includes(item.category.toLowerCase())) {
                jarsTotals[jarKey] += item.amount;
                break;
            }
        }
    });
    renderFiveJarsBars(jarsTotals);
}

function renderFiveJarsBars(totals) {
    const incomeInput = document.getElementById("monthly-income-input");
    const totalIncome = parseFloat(incomeInput.value) || 0;
    const container = document.getElementById("five-jars-container");
    
    let html = `<h3 style="margin: 0 0 20px 0; font-size: 1.1rem; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;">📊 مؤشر الأداء المالي (الفعلي vs المستهدف بناءً على خطة الانستغرام)</h3>`;
    html += `<div style="display: flex; flex-direction: column; gap: 18px;">`;

    for (const key in JARS_MAPPING) {
        const jar = JARS_MAPPING[key];
        const targetAmount = totalIncome * jar.targetPercent;
        const actualAmount = totals[key] || 0;
        
        // حساب النسبة المئوية لتقدم الشريط المالي الأساسي CSS
        const percentOfTarget = targetAmount > 0 ? (actualAmount / targetAmount) * 100 : 0;
        
        // لمسة ذكية: إذا تجاوزت المصاريف الثابتة أو الـ Guilt-Free الميزانية يتحول المؤشر للون تحذيري مرن
        const isOverBudget = actualAmount > targetAmount && (key === 'fixed' || key === 'guiltFree');
        const barColor = isOverBudget ? "#e74c3c" : jar.color;

        html += `
            <div>
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; font-weight: 500;">
                    <span><strong>${jar.name}</strong> (${(jar.targetPercent * 100)}%)</span>
                    <span>الفعلي: <strong style="color:${barColor};">$${actualAmount.toFixed(2)}</strong> / المستهدف: <strong>$${targetAmount.toFixed(2)}</strong></span>
                </div>
                <!-- Native CSS Bar Outer -->
                <div style="background: #eef2f3; height: 14px; border-radius: 7px; width: 100%; overflow: hidden; position: relative; border: 1px solid #dcdde1;">
                    <!-- Native CSS Bar Inner Dynamic -->
                    <div style="background: ${barColor}; height: 100%; width: ${Math.min(percentOfTarget, 100)}%; transition: width 0.4s ease; border-radius: 7px;"></div>
                </div>
                <div style="display: flex; justify-content: flex-end; font-size: 0.75rem; color: #7f8c8d; margin-top: 3px;">
                    <span>استهلاك الميزانية المحددة: ${percentOfTarget.toFixed(1)}%</span>
                </div>
            </div>
        `;
    }

    html += `</div>`;
    container.innerHTML = html;
}

// القسم 4: واجهة الطي الذكي (Collapse) للشهور والتصنيفات + جدول كاشف الاشتراكات الدوري المدمج
function renderMonthlyCollapseInterface() {
    const mainDashboardContainer = document.getElementById("dashboard-details-container");
    if (!mainDashboardContainer) return; // الحماية من أخطاء عدم وجود العناصر

    // تجميع البيانات ذكياً حسب الشهور بناءً على تنسيق التاريخ dd/MM/yyyy المعتمد صرامة في النواة
    const monthlyGroups = {};

    globalParsedData.forEach(item => {
        const dateParts = item.date.split('/');
        if (dateParts.length < 3) return;
        const monthYear = `${dateParts[1]}/${dateParts[2]}`; // استخراج MM/yyyy

        if (!monthlyGroups[monthYear]) {
            monthlyGroups[monthYear] = { total: 0, categories: {} };
        }
        monthlyGroups[monthYear].total += item.amount;

        if (!monthlyGroups[monthYear].categories[item.category]) {
            monthlyGroups[monthYear].categories[item.category] = 0;
        }
        monthlyGroups[monthYear].categories[item.category] += item.amount;
    });

    let html = `<h3 style="margin: 25px 0 15px 0; font-size: 1.1rem; color: #2c3e50;">📅 سجل تفاصيل الشهور (الطي والتصنيفات الذكية)</h3>`;
    
    // بناء الهيكل التفاعلي المدعوم بميزة بقاء الإجمالي والمخطط ظاهران دائماً عند الإغلاق
    for (const month in monthlyGroups) {
        const mData = monthlyGroups[month];
        html += `
            <div style="border: 1px solid #dcdde1; border-radius: 8px; margin-bottom: 12px; background: #fff; overflow: hidden;">
                <!-- رأس الشهر الظاهر دائماً -->
                <div onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none';" style="background: #f1f2f6; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none;">
                    <span style="font-weight: bold; color: #2c3e50;">🗓️ شهر: ${month}</span>
                    <span style="background: #2ecc71; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9rem;">إجمالي الشهر الفعلي: $${mData.total.toFixed(2)}</span>
                </div>
                <!-- المحتوى القابل للطي الذكي والتفاعل الداخلي بالتصنيفات -->
                <div style="display: none; padding: 15px; border-top: 1px solid #dcdde1;">
                    <h4 style="margin: 0 0 10px 0; font-size: 0.95rem; color: #7f8c8d;">توزيع مصاريف التصنيفات الحقيقية:</h4>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
        `;

        for (const cat in mData.categories) {
            const catAmount = mData.categories[cat];
            const catPercent = (catAmount / mData.total) * 100;
            html += `
                <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem;">
                    <span style="width: 120px; font-weight: 500;">🔹 ${cat}</span>
                    <div style="background: #f5f6fa; flex-grow: 1; height: 10px; border-radius: 5px; margin: 0 10px; overflow: hidden;">
                        <div style="background: #7f8c8d; height:100%; width: ${catPercent}%;"></div>
                    </div>
                    <span style="font-weight: bold; width: 80px; text-align: left;">$${catAmount.toFixed(2)} (${catPercent.toFixed(1)}%)</span>
                </div>
            `;
        }

        html += `</div></div></div>`;
    }

    // جدول كاشف الاشتراكات الدورية المدمج في أسفل لوحة التحكم الثابتة
    html += `
        <div style="margin-top: 30px; background: #fff; border: 1px solid #e74c3c; border-radius: 12px; padding: 20px;">
            <h3 style="margin: 0 0 15px 0; font-size: 1.05rem; color: #c0392b; display: flex; align-items: center; gap: 8px;">🔄 جدول كاشف الاشتراكات الدورية والمدفوعات المتكررة</h3>
            <table style="width: 100%; border-collapse: collapse; text-align: right; font-size: 0.85rem;">
                <thead>
                    <tr style="border-bottom: 2px solid #e74c3c; color: #c0392b;">
                        <th style="padding: 8px;">التاريخ</th><th style="padding: 8px;">التصنيف المالي</th><th style="padding: 8px;">الوصف الفعلي</th><th style="padding: 8px; text-align: left;">المبلغ بالدولار</th>
                    </tr>
                </thead>
                <tbody id="subscription-rows-injector">
                    <!-- تُحقن المدفوعات الدورية التي تظهر بانتظام وتكرار تلقائياً هنا -->
                    <tr style="color: #7f8c8d;"><td colspan="4" style="padding: 15px; text-align: center;">يتم الكشف التلقائي عند رفع ملف الـ CSV...</td></tr>
                </tbody>
            </table>
        </div>
    `;

    mainDashboardContainer.innerHTML = html;
}
