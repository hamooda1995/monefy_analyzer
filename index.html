<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>📊 لوحة تحليلات مصاريف Monefy الشاملة - حمودة</title>
        <link rel="manifest" href="manifest.json" />
        <!-- ربط ملف التصميم الخارجي -->
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <button
            onclick="toggleDarkModeFinancialApp()"
            class="theme-toggle-btn"
            id="themeToggleBtn"
            style="width: auto; text-align: center;visibility: hidden;"
        >
            🌙
        </button>

        <!-- زر الآلة الحاسبة العائم -->
        <button onclick="toggleCurrencyCalcModal(true)" class="theme-toggle-btn" style="width: auto; text-align: center;">🧮</button>

        <!-- النافذة المنبثقة Modal للآلة الحاسبة -->
        <div class="calc-modal-overlay" id="calcModalOverlay" onclick="if(event.target===this) toggleCurrencyCalcModal(false)">
            <div class="calc-modal-content">
                <div class="calc-modal-header">
                    <h3>🧮 حاسبة العملات والنقد</h3>
                    <button class="calc-close-btn" onclick="toggleCurrencyCalcModal(false)">✖</button>
                </div>
                <div id="currencyRowsContainer">
                    <!-- سيتم توليد أسطر العملات هنا -->
                </div>
                
                <div class="calc-actions">
                    <button onclick="addNewCurrencyRow()" style="margin-top:0; font-size: 13px;">➕ إضافة فئة عملة جديدة</button>
                    <button onclick="resetCurrencyCalc()" class="calc-btn-secondary" style="margin-top:0; font-size: 13px;">🔄 تصفير</button>
                </div>

                <div class="calc-total-box" id="calcGrandTotal">
                    المجموع: 0.00
                </div>
            </div>
        </div>

        <div class="container">
            <button id="installBtn" style="display: none">Install App</button>

            <h2>📊 لوحة تحليلات ومخططات مصاريف Monefy الشاملة</h2>

            <div class="form-group">
                <label for="csvFile">1. اختر ملف البيانات الصادر (CSV):</label>
                <input type="file" id="csvFile" accept=".csv" />
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label for="startDate">تاريخ البدء:</label>
                    <input type="date" id="startDate" value="2026-05-01" />
                </div>
                <div class="form-group">
                    <label for="endDate">تاريخ النهاية (مشمول):</label>
                    <input type="date" id="endDate" />
                </div>
            </div>
            
            <div
                class="date-row"
                style="
                    background: var(--table-stripe);
                    padding: 15px;
                    border-radius: 8px;
                    margin-top: 15px;
                    border: 1px solid var(--border-color);
                "
            >
                <div class="form-group" style="width: 100%;">
                    <label for="initial-carryover-input">📥 مبلغ مدوّر من الشهر السابق ($):</label>
                    <input
                        type="number"
                        id="initial-carryover-input"
                        value="0"
                        oninput="triggerConditionalCalculation()"
                    />
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
    <button onclick="processAndDisplay(true)" style="flex: 2;">تحليل وعرض الحسابات والمخططات فورا 🚀</button>
    <button onclick="exportAnalysisToCSV()" class="calc-btn-secondary" style="flex: 1; margin-top: 10px; background-color: #38A169 !important;">📥 تصدير التقرير (CSV)</button>
</div>
        </div>

        <div id="resultsContainer"></div>

        <!-- ملفات التطبيق مرتبة حسب التبعية: config → state → utils → features → render → ui → main -->
        <script src="config.js"></script>
        <script src="state.js"></script>
        <script src="utils.js"></script>
        <script src="theme.js"></script>
        <script src="calculator.js"></script>
        <script src="parser.js"></script>
        <script src="jars.js"></script>
        <script src="sections.js"></script>
        <script src="render.js"></script>
        <script src="ui.js"></script>
        <script src="export.js"></script>
        <script src="main.js"></script>
    </body>
</html>
